name: CI/CD Completo (Monorepo)

on:
  push:
    branches:
      - deploy

jobs:
  # ==========================================
  # 1. PIPELINE FRONTEND
  # ==========================================
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push Frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: innovatech-frontend
          # Corrección: Uso de SHA del commit para trazabilidad de imágenes
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd "proyecto semestral/front_despacho"
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Desplegar Frontend en EKS
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws eks update-kubeconfig --region us-east-1 --name DEVOPS-EKS --role-arn arn:aws:iam::483515891285:role/LabRole          cd "proyecto semestral/front_despacho"
          
          # Corrección: Inyección segura restringida solo a la variable IMAGE_TAG
          if [ -f k8s/innovatech-deploy.yaml ]; then
            envsubst '${IMAGE_TAG}' < k8s/innovatech-deploy.yaml > tmp.yaml && mv tmp.yaml k8s/innovatech-deploy.yaml
          fi
          
          kubectl apply -f k8s/
          kubectl rollout restart deployment/frontend-deployment

  # ==========================================
  # 2. PIPELINE DESPACHOS (BACKEND)
  # ==========================================
  deploy-despachos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr-despachos
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push Despachos
        env:
          ECR_REGISTRY: ${{ steps.login-ecr-despachos.outputs.registry }}
          ECR_REPOSITORY: innovatech-backend-despachos
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd "proyecto semestral/back-Despachos_SpringBoot"
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Desplegar Despachos en EKS
        env:
          IMAGE_TAG: ${{ github.sha }}
          DB_ENDPOINT: ${{ secrets.DB_ENDPOINT }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          aws eks update-kubeconfig --region us-east-1 --name DEVOPS-EKS
          cd "proyecto semestral/back-Despachos_SpringBoot"
          
          # Corrección: Inyección segura restringida de secretos e imagen
          envsubst '${DB_ENDPOINT} ${DB_PORT} ${DB_NAME} ${DB_USERNAME} ${DB_PASSWORD}' < k8s/innovatech-secret.yaml > tmp-sec.yaml && mv tmp-sec.yaml k8s/innovatech-secret.yaml
          envsubst '${IMAGE_TAG}' < k8s/innovatech-deploy.yaml > tmp-dep.yaml && mv tmp-dep.yaml k8s/innovatech-deploy.yaml
          
          kubectl apply -f k8s/
          kubectl rollout restart deployment/despachos-deployment

  # ==========================================
  # 3. PIPELINE VENTAS (BACKEND)
  # ==========================================
  deploy-ventas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr-ventas
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push Ventas
        env:
          ECR_REGISTRY: ${{ steps.login-ecr-ventas.outputs.registry }}
          ECR_REPOSITORY: innovatech-backend-ventas
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd "proyecto semestral/back-Ventas_SpringBoot"
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Desplegar Ventas en EKS
        env:
          IMAGE_TAG: ${{ github.sha }}
          DB_ENDPOINT: ${{ secrets.DB_ENDPOINT }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          aws eks update-kubeconfig --region us-east-1 --name DEVOPS-EKS
          cd "proyecto semestral/back-Ventas_SpringBoot"
          
          envsubst '${DB_ENDPOINT} ${DB_PORT} ${DB_NAME} ${DB_USERNAME} ${DB_PASSWORD}' < k8s/innovatech-secret.yaml > tmp-sec.yaml && mv tmp-sec.yaml k8s/innovatech-secret.yaml
          envsubst '${IMAGE_TAG}' < k8s/innovatech-deploy.yaml > tmp-dep.yaml && mv tmp-dep.yaml k8s/innovatech-deploy.yaml
          
          kubectl apply -f k8s/
          kubectl rollout restart deployment/ventas-deployment